# release-plz workspace config. Defaults aim for: open a Release PR on every
# main push, bump only crates that actually changed (per-crate independent
# versions), keep every internal `path` dep version pin in sync, publish in
# topological order on merge.
#
# Reference: https://release-plz.ieni.dev/docs/config

[workspace]
# Per-crate independent versioning. Each crate carries its own literal
# `version = "X.Y.Z"` in its Cargo.toml — release-plz bumps only the crates
# that changed since their last `<name>-v<version>` tag, then rewrites every
# `nexo-X = { version = "...", path = "..." }` reference across the workspace
# (including the root bin's Cargo.toml) so internal pins stay aligned.
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"

# Per-crate CHANGELOG.md (release-plz writes one inside each crate dir).
changelog_update = true

# Single batched Release PR for the whole workspace — easier to review than
# one PR per crate when many move together.
pr_name = "release: batched workspace bumps"
pr_branch_prefix = "release-plz/"

# Patch for `fix:`/`chore:`/`docs:`, minor for `feat:`, major for `!` or
# `BREAKING CHANGE:`. `cargo-semver-checks` upgrades a planned minor → major
# when the public API actually broke.
semver_check = true

# Publish settings shared by every crate.
publish_allow_dirty = false      # CI tree must be clean — no uncommitted WIP
publish_no_verify   = false      # full verify (compile) before upload
publish_timeout     = "10m"      # per-crate timeout
release_always      = false      # only release crates that the release-PR bumped
                                 # — avoids retrying old publishes on every push.

# The workspace bin (`nexo-rs`) is the last node in the topo order; release-plz
# already infers this from the dep graph, but we mark it explicitly so a crate
# rename never accidentally drops it from the publish set.
[[package]]
name = "nexo-rs"
publish = true
release = true

# Crates that are not part of the public release surface (Phase 67
# driver subsystem internals + the dispatch tooling that backs the
# CLI). Set `publish = false` so release-plz never tries to push
# them to crates.io and never tries to create their git release tag.
# Operators on the published track only need the runtime + plugins;
# the driver layer ships separately when its security review closes.
[[package]]
name = "nexo-driver-types"
publish = false
release = false

[[package]]
name = "nexo-driver-permission"
publish = false
release = false

[[package]]
name = "nexo-driver-claude"
publish = false
release = false

[[package]]
name = "nexo-driver-loop"
publish = false
release = false

[[package]]
name = "nexo-project-tracker"
publish = false
release = false

[[package]]
name = "nexo-agent-registry"
publish = false
release = false

[[package]]
name = "nexo-dispatch-tools"
publish = false
release = false

# Companion-tui is also private for now — the WS handshake hasn't
# landed yet so the surface area isn't stable enough to publish.
# Will flip to publish=true once PR-4.x ships.
[[package]]
name = "nexo-companion-tui"
publish = false
release = false

# To skip a crate, add:
#   [[package]]
#   name = "nexo-internal"
#   publish = false

# Phase 81.19.a — release-plz `cargo package` step explodes
# when diffing crate state against the historical commit
# `e2b6f36` (May 4) because that commit's `[patch.crates-io]`
# stanza referenced an absolute local path
# (`wa-agent = { path = "/home/familia/whatsapp-rs" }`). The
# patch is workspace-level so the failure repeats for EVERY
# nexo-* crate release-plz walks (not just tool-meta). The
# 81.18.c partial publish (commit `a06c767`) shipped
# `nexo-tool-meta v0.1.1` so that crate's diff target is now
# v0.1.1 (no longer touches v0.1.0 → e2b6f36 history) — but
# the other 7+ crates release-plz walks still trip on the
# bad commit until each gets a manual publish past it.
#
# Workaround: mark every workspace crate `release = false`
# except the ones whose latest registry version POSTDATES
# `e2b6f36`. release-plz then skips them entirely from the
# diff walk. The drivers/dispatch internals were already
# `release = false` for security review reasons. Drop this
# override once the full publish wave (`81.18.c.full`)
# concludes.

# nexo-tool-meta — published v0.1.1 manually 2026-05-09; no
# longer needs to skip but the override is harmless until
# the next release-plz config touch.
[[package]]
name = "nexo-tool-meta"
release = false

# Crates whose history walks the bad commit. Hold them out of
# release-plz until each gets a manual publish that postdates
# `e2b6f36`. Order matches the topological publish layers
# (`scripts/publish-order.sh`).
