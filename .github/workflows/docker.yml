name: docker

# Build and push the multi-arch Nexo container image to ghcr.io.
#
# Triggers:
#   - push to `main` (publishes `:edge` + `:sha-<short>`)
#   - push of a `v*` tag    (publishes `:latest`, `:vX.Y.Z`, `:vX.Y`, `:vX`)
#   - workflow_dispatch     (manual rebuild)
#
# Built archs: linux/amd64, linux/arm64 (matches Termux + most servers).
# Image is signed inline by `docker/build-push-action@v5` provenance —
# Cosign signing of the digest is layered on in Phase 27.3.

on:
  # Auto-publish enabled. Multi-arch builds amd64 + arm64 take
  # ~10-15 min per run — slow but worth it for the multi-arch
  # adoption story.
  #
  # Triggers:
  #   - main push        → :edge + :sha-<short>      (every commit)
  #   - nexo-rs-v* tag   → :latest + :vX.Y.Z         (release)
  #
  # Tag pattern matches release-plz's `git_tag_name = "{{ package }}-v{{ version }}"`
  # so a release tag fires this workflow alongside release.yml.
  push:
    branches: [main]
    tags: ["nexo-rs-v*"]
  workflow_dispatch:

# Cancel obsolete in-flight multi-arch builds on burst pushes —
# cargo-release wave + drive-by fmt fixes can stack 5+ builds in
# the queue at 10-15min each. Without this, runner pool stays
# saturated and downstream workflows (CI) sit queued for an hour+.
# Tag-pushes use a separate group so a `v*` release tag never
# cancels its own builds.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write   # for keyless OIDC if Cosign added later

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=edge,branch=main
            # Tag pattern is `nexo-rs-vX.Y.Z`, not bare `vX.Y.Z`,
            # so `type=semver` won't auto-match. Use `type=match`
            # with capture groups to strip the `nexo-rs-` prefix.
            type=match,pattern=nexo-rs-v(.+),group=1
            type=match,pattern=nexo-rs-v(\d+\.\d+),group=1
            type=match,pattern=nexo-rs-v(\d+),group=1
            # `:latest` only on GA tags — pre-release `-rc` /
            # `-beta` / `-alpha` markers don't claim it.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/nexo-rs-v') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
          labels: |
            org.opencontainers.image.title=Nexo
            org.opencontainers.image.description=Multi-agent Rust framework with NATS, MCP, and channel plugins
            org.opencontainers.image.url=https://github.com/lordmacu/nexo-rs
            org.opencontainers.image.documentation=https://lordmacu.github.io/nexo-rs/
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Build + push (linux/amd64,linux/arm64)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache: shaves ~10 min off cold builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Phase 27.3 — keyless Cosign signing of the published image
      # digest. Uses the workflow's OIDC identity (no key material to
      # manage); the signature lands in the Rekor transparency log.
      # Verify with:
      #   cosign verify ghcr.io/lordmacu/nexo-rs:<tag> \
      #     --certificate-identity-regexp 'https://github.com/lordmacu/nexo-rs/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign image digest with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Sign each tag at the same content digest so any pulled
          # tag verifies against the same signature.
          for tag in $TAGS; do
            echo "==> cosign sign $tag@$DIGEST"
            cosign sign --yes "$tag@$DIGEST"
          done
