[package]
name = "nexo-tunnel"
description   = "Pure-Rust quick-tunnel client for Nexo agents — wraps cloudflare-quick-tunnel to expose a local TCP port over https://*.trycloudflare.com with no cloudflared subprocess."
version       = "0.2.0"
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = { workspace = true }
categories    = { workspace = true }

[dependencies]
tokio                   = { workspace = true, features = ["io-util", "macros", "rt", "sync"] }
anyhow                  = { workspace = true }
tracing                 = { workspace = true }
cloudflare-quick-tunnel = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
