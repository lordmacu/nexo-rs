[package]
name = "nexo-tunnel"
description   = "Tunneling helpers for Nexo agents (Termux and local exposure)."
version       = "0.1.3"
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = { workspace = true }
categories    = { workspace = true }
[dependencies]
tokio       = { workspace = true, features = ["process", "io-util", "macros", "rt"] }
anyhow      = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
# `stream` for `Response::bytes_stream()` (chunked cloudflared
# download); `rustls-tls` because the workspace base reqwest has
# `default-features = false` (no TLS backend). Both get unified in
# at workspace level via the root bin's reqwest features, but a
# standalone `cargo publish` of this crate must declare them itself.
reqwest     = { workspace = true, features = ["stream", "rustls-tls"] }
futures     = { workspace = true }
directories = "5"
flate2      = "1"
tar         = "0.4"
regex       = "1"
bytes       = "1"
indicatif   = "0.17"

[dev-dependencies]
tempfile    = "3"

[lints]
workspace = true
