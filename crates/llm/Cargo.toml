[package]
name = "nexo-llm"
description   = "LLM provider clients (MiniMax, OpenAI-compat, Anthropic, Gemini) with rate limiter and tool registry."
version       = "0.1.5"
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = { workspace = true }
categories    = { workspace = true }
[features]
default = []
# Historical: stubbed `AnyLlmClient::Stub` variant. After the registry refactor,
# tests instantiate fakes via `Arc<dyn LlmClient>` directly — feature is a no-op
# and kept only to avoid breaking external manifests that still mention it.
stub    = []

[dependencies]
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
tracing      = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "stream", "cookies", "http2"] }
futures      = { workspace = true }
eventsource-stream = { workspace = true }
bytes        = { workspace = true }
dashmap      = { workspace = true }
nexo-config = { version = "0.1.8", path = "../config" }
nexo-resilience = { version = "0.1.3", path = "../resilience" }
# Phase 82.10.u — factories declare credential schema + auth modes
# in shared wire types so admin RPC + SPA wizard render dynamic
# forms without each crate re-defining the descriptor shape.
nexo-tool-meta = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
chrono       = { workspace = true }
base64       = { workspace = true }
tiktoken-rs  = { workspace = true }
blake3       = { workspace = true }
lru          = { workspace = true }
tempfile     = "3"

[dev-dependencies]
tokio-test = "0.4"
wiremock   = "0.6"
criterion  = { version = "0.5", features = ["async_tokio"] }
tracing-subscriber = { workspace = true }
serial_test         = "3"

[[bench]]
name = "sse_parsers"
harness = false

[lints]
workspace = true
