[package]
name = "nexo-poller"
description   = "Generic polling runtime: cron schedules, retries, ack semantics."
version       = "0.1.2"
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = { workspace = true }
categories    = { workspace = true }
[dependencies]
nexo-broker = { version = "0.1.5", path = "../broker" }
nexo-config = { version = "0.1.9", path = "../config" }
nexo-auth = { version = "0.1.7", path = "../auth" }
nexo-resilience = { version = "0.1.3", path = "../resilience" }
nexo-llm = { version = "0.1.5", path = "../llm" }

tokio        = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_yaml   = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
chrono       = { workspace = true }
arc-swap     = { workspace = true }
dashmap      = { workspace = true }
sqlx         = { workspace = true }
reqwest      = { workspace = true }
tokio-util   = { workspace = true }
cron         = "0.12"
humantime    = { workspace = true }
regex        = "1"
base64       = { workspace = true }
# Phase 94 — switched from path-dep to published crates.io
# release. `google_calendar` + `gmail` builtins still call the
# OAuth client in-process, but the lib code now lives in the
# standalone repo + crates.io. Enables deletion of the in-tree
# `crates/plugins/google/` directory in this same wave.
nexo-plugin-google = "0.2.1"

[features]
default = []
cron-tz = ["chrono-tz"]

[dependencies.chrono-tz]
version = "0.9"
optional = true

[dev-dependencies]
tempfile = "3"
tokio    = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
