[package]
name        = "nexo-microapp-sdk"
description = "Reusable runtime helpers for Phase 11 stdio microapps consuming the nexo-rs daemon (JSON-RPC dispatch loop, BindingContext parsing, typed replies)."
version       = "0.1.12"
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = ["nexo", "microapp", "extension", "agent", "sdk"]
categories    = ["api-bindings", "asynchronous"]

[lints]
workspace = true

[features]
default       = []
admin         = ["dep:dashmap"]
outbound      = []
test-harness  = []
webhook       = []
# Phase 82.10.m.b — generic helpers for `Microapp::with_notification_listener`
# bridges (decode `Value` → typed T → broadcast). Used by
# microapps that fan out daemon notifications to per-connection
# SSE streams.
notifications = []
# Generic event log + broadcast scaffolding lifted from the
# agent-creator-microapp's firehose module. Provides
# `EventStore<T>` (SQLite append-log with retention sweep),
# `EventBroadcastState<T>` (store + tokio broadcast), a persisting
# listener that combines `notifications::build_broadcast_listener`
# with a SQLite-append side-effect, and the sweep-loop task.
# Implies `notifications` so the persisting listener can reuse
# the decode-then-broadcast helper.
events = ["notifications", "dep:sqlx", "dep:chrono", "dep:tokio-util"]
# Local speech-to-text for inbound voice notes — `TranscribeConfig`
# + `transcribe_file` + an `InboundTransformHandler` that
# implements `ToolHandler` so a microapp registers the
# `*_inbound_transform` tool with one line. Whisper.cpp ships as a
# vendored C build via `whisper-rs` (~30 s on first compile);
# guarded by this feature so non-voice microapps skip it. Decoding
# of arbitrary audio formats (ogg-opus, mp3, aac, flac, wav, …)
# uses `symphonia` — pure Rust, no external `ffmpeg` binary
# dependency at runtime.
stt = ["dep:whisper-rs", "dep:opus-wave", "dep:ogg"]
# First-run wizard scaffolding: a generic `CachedSnapshot<T>` with
# TTL invalidation and an `LlmProber` that validates an OpenAI-
# compatible API key server-side (`GET {base_url}/models`) so the
# raw key never leaves the microapp. Pulls `reqwest` rustls-only
# to avoid system OpenSSL.
wizard = ["dep:reqwest"]
# Voice-mode reply pipeline — `VoiceModeStore` toggle + text
# normalizer + SSML hinter + `TtsProvider` trait with a Microsoft
# Edge Read-Aloud impl + `synthesize_voice_note` end-to-end
# pipeline (text → SSML → mp3 → opus/ogg). Edge's public endpoint
# only reliably streams the mp3 profiles, so the SDK transcodes
# the mp3 to ogg-opus in pure Rust before handing the bytes to the
# WhatsApp PTT path: `symphonia` decodes the mp3, `opus-wave`
# encodes opus packets, `ogg` muxes the container. Implies
# `events` so the store can ride on the same SQLite pool the
# firehose owns.
voice = [
    "events",
    "dep:msedge_tts",
    "dep:regex",
    "dep:once_cell",
    "dep:symphonia",
    "dep:opus-wave",
    "dep:ogg",
]
# Phase 81.15.a — child-side `PluginAdapter` for out-of-tree
# subprocess plugins. Gated so existing microapp consumers don't
# pull the `nexo-plugin-manifest` + `nexo-broker` deps unless they
# author plugins. Plugin authors enable this feature in their
# Cargo.toml; microapp authors leave it off.
plugin = ["dep:nexo-plugin-manifest", "dep:nexo-broker", "dep:nexo-llm", "dep:nexo-memory", "dep:toml", "dep:dashmap"]
# Phase 82.15 / M15.3 — identity store traits + sqlite default
# impl. Person + PersonEmail + Company stores keyed by tenant
# id with composite indexes. Pulls sqlx + chrono so non-CRM
# microapps don't pay the dep cost.
identity = ["dep:sqlx", "dep:chrono"]
# Phase 82.15 / M15.4 — declarative routing rules engine.
# Predicate AST + tenant-scoped dispatcher + YAML loader.
# Pulls serde_yaml; useful beyond CRM (any microapp routing
# inbound to handlers per declarative rules).
routing = ["dep:serde_yaml"]
# Phase 82.15 / M15.5 — enrichment primitives.
# Curated domain classifier (200+ public providers + 30
# disposable hosts), TTL-keyed (tenant_id, domain) sqlite
# cache, and an EnrichmentSource trait + chain runner so
# consumers compose fallback adapters in priority order.
enrichment = ["dep:sqlx", "dep:once_cell"]
# M15.23.a.1 — Engagement tracking primitives: HMAC-signed
# `MsgId` / `LinkId` URL tokens, HTML helpers that inject the
# 1×1 open-pixel + rewrite anchor `href` through the click
# redirector, plus a pure 1×1 transparent GIF blob constant
# the ingest route serves. Async storage layer lives separately
# in `tracking-store` so consumers that only need URL signing /
# HTML rewriting don't pull SQLx.
tracking = ["dep:hmac", "dep:sha2", "dep:subtle", "dep:base64", "dep:regex", "dep:once_cell"]
tracking-store = ["tracking", "dep:sqlx", "dep:chrono"]
# M15.23.f — Lead scoring primitives: a `Scorer` trait, a
# `Score` newtype (0..=100) carrying reason traces, and a
# `HeuristicScorer` default that composes weighted rules
# (domain kind, response time, reply length, intent label,
# signature seniority hint). Pure-rust, no async, no extra
# deps — every microapp / extension that wants tenant-scoped
# scoring picks the trait up for free.
scoring = []
# M15.23.d — Topic guardrail classifier: a pure-rust regex-
# based tagger that scans inbound text against an operator-
# configured list of patterns + actions (`force_approval` /
# `block`). Used by any extension that wants to gate
# autonomous behaviour on topic-sensitive content. Pulls
# `regex` + `once_cell` (compile-once cached patterns).
guardrails = ["dep:regex", "dep:once_cell"]
# M15.23.b — Operator-supplied template library + snippets.
# Re-exports the workspace `render_template` (mustache-lite,
# `{{path.to.field}}` over a JSON context) plus typed wire
# shapes for named templates + reusable snippets. Sandboxed
# by construction — no helpers, no eval, no IO. Pulls only
# the existing serde + nexo-tool-meta deps already in tree.
templating = []
# F26 — opt-in Handlebars renderer for templates that
# outgrow the mustache-lite default (conditionals, loops,
# `{{#with}}` blocks). Sandboxed-by-construction: no
# custom helpers / partials registered, no filesystem /
# network access surfaces. Strictly additive on top of the
# `templating` feature.
templating-handlebars = ["templating", "dep:handlebars"]
# F29 — email subject normalisation + synthetic thread-id
# helpers. Pure string primitives mined during M17.3 in the
# marketing extension; reusable by any microapp that
# ingests inbound email (helpdesk, archive, CRM). Pulls
# `sha2` for the deterministic synth-id hash.
email-threading = ["dep:sha2"]
# F29 — generic time-bucketed dedup cache. In-memory by
# default; opt-in `dedup-sled` feature persists across
# process restarts. Lifted from the marketing extension's
# F25 work — useful for any notification publisher that
# needs to suppress at-least-once redelivery duplicates.
dedup = []
dedup-sled = ["dedup", "dep:sled"]

[dependencies]
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
async-trait = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
nexo-tool-meta = { workspace = true }
uuid        = { workspace = true }
# Phase 82.10 — admin RPC pending-request map. Optional dep
# (only the `admin` feature pulls it). Keeps the default
# microapp dep tree slim.
dashmap     = { workspace = true, optional = true }
# Phase 81.15.a — gated by the `plugin` feature. Pulled only by
# plugin authors who use `PluginAdapter`; microapp authors leave
# the feature off and don't pay the dep cost.
nexo-plugin-manifest = { version = "0.1.1", path = "../plugin-manifest", optional = true }
nexo-broker = { version = "0.1.1", path = "../broker", optional = true }
# Phase 81.15.c — child-side typed wrappers for memory.recall +
# llm.complete RPCs. nexo-llm gives ChatMessage/ChatRequest/
# ChatResponse types so authors construct + decode messages
# with the same shape the daemon uses; nexo-memory gives
# MemoryEntry for recall_memory results.
nexo-llm = { version = "0.1.1", path = "../llm", optional = true }
nexo-memory = { version = "0.1.2", path = "../memory", optional = true }
toml = { version = "0.8", optional = true }
# `events` feature — SQLite append-log + retention sweep +
# wall-clock cutoff for time-based pruning. All optional;
# microapps that don't enable `events` skip the deps entirely.
sqlx       = { workspace = true, optional = true }
chrono     = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
# `stt` feature — whisper.cpp wrapper. Default-features off to
# skip the OpenBLAS auto-link (each microapp surfaces its own BLAS
# preference via system libs if needed).
whisper-rs = { version = "0.13", default-features = false, optional = true }
# Pure-Rust audio codec stack shared by `stt` (decoding inbound
# WhatsApp/Telegram ogg-opus voice notes) and `voice` (encoding
# the mp3 Edge returns into the ogg-opus PTT format WhatsApp
# expects). Replaces the `ffmpeg` subprocess in both pipelines:
#
# - `opus-wave` is a SILK+CELT codec (RFC 6716 conformant and
#   cross-validated against C libopus); ships both decoder and
#   encoder.
# - `ogg` muxes/demuxes the container.
# - `symphonia` decodes mp3 (Edge TTS output) and other formats
#   when broader STT input support is enabled.
opus-wave = { version = "3.0", optional = true }
ogg = { version = "0.9", optional = true }
symphonia = { version = "0.5", default-features = false, features = [
    "mp3"
], optional = true }
# `wizard` feature — server-side LLM key probe. rustls-only to
# match the agent-creator-microapp baseline (no system OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# `voice` feature — Microsoft Edge Read-Aloud websocket wrapper.
msedge_tts = { package = "msedge-tts", version = "0.3", optional = true }
regex      = { version = "1", optional = true }
once_cell  = { version = "1", optional = true }
# `routing` feature — YAML loader for the rules engine.
# Same workspace serde_yaml version as the rest of the framework.
serde_yaml = { workspace = true, optional = true }
# `tracking` feature — HMAC token signer + HTML helpers.
# RustCrypto MAC stack; constant-time tag comparison via subtle.
hmac   = { version = "0.12", optional = true }
sha2   = { version = "0.10", optional = true }
subtle = { version = "2",    optional = true }
base64 = { version = "0.22", optional = true }
# F29 — sled keyspace for cross-restart notification dedup.
# Optional; default builds skip it.
sled   = { version = "0.34", optional = true }
# F26 — Handlebars renderer for the `templating-handlebars`
# feature. Default features keep the dep tree narrow (no
# heavy deps).
handlebars = { version = "5", default-features = false, optional = true }

[dev-dependencies]
nexo-microapp-sdk = { path = ".", features = ["test-harness", "outbound", "events", "stt", "wizard", "voice", "identity", "routing", "enrichment", "tracking", "tracking-store", "scoring", "guardrails", "templating", "templating-handlebars", "email-threading", "dedup", "dedup-sled"] }
tempfile          = "3"
tokio             = { workspace = true, features = ["full"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
