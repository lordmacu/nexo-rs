[package]
name        = "nexo-microapp-sdk"
description = "Reusable runtime helpers for Phase 11 stdio microapps consuming the nexo-rs daemon (JSON-RPC dispatch loop, BindingContext parsing, typed replies)."
version       = "0.1.15"
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = ["nexo", "microapp", "extension", "agent", "sdk"]
categories    = ["api-bindings", "asynchronous"]

[lints]
workspace = true

[features]
default       = []
admin         = ["dep:dashmap"]
outbound      = []
test-harness  = []
webhook       = []
# Phase 82.10.m.b — generic helpers for `Microapp::with_notification_listener`
# bridges (decode `Value` → typed T → broadcast). Used by
# microapps that fan out daemon notifications to per-connection
# SSE streams.
notifications = []
# Generic event log + broadcast scaffolding lifted from the
# agent-creator-microapp's firehose module. Provides
# `EventStore<T>` (SQLite append-log with retention sweep),
# `EventBroadcastState<T>` (store + tokio broadcast), a persisting
# listener that combines `notifications::build_broadcast_listener`
# with a SQLite-append side-effect, and the sweep-loop task.
# Implies `notifications` so the persisting listener can reuse
# the decode-then-broadcast helper.
events = ["notifications", "dep:sqlx", "dep:chrono", "dep:tokio-util"]
# Local speech-to-text for inbound voice notes — `TranscribeConfig`
# + `transcribe_file` + an `InboundTransformHandler` that
# implements `ToolHandler` so a microapp registers the
# `*_inbound_transform` tool with one line.
#
# **Legacy backend** — Whisper.cpp ships as a vendored C build via
# `whisper-rs` (~30 s on first compile). Requires Visual Studio
# Build Tools 2022 + CMake on Windows. New builds targeting
# Windows / Android / WASM should prefer `stt-candle` (pure
# Rust); `stt` is retained for backwards compatibility with
# existing microapps that ship `whisper-rs` + GGML `.bin` model
# files until Phase 91.12 deprecates this path.
#
# Audio decode (ogg-opus from WhatsApp / Telegram voice notes)
# uses `opus-wave` + `ogg` — pure Rust, no `ffmpeg` subprocess.
stt = ["dep:whisper-rs", "dep:opus-wave", "dep:ogg"]
# Phase 91 — pure-Rust Whisper inference via HuggingFace Candle.
# Eliminates the whisper.cpp C++ build chain (no VS Build Tools
# 2022 / CMake on Windows; trivial Android NDK + WASM
# cross-compile). Model format flips from GGML `.bin` to
# SafeTensors directory; HF Hub auto-fetch handles first-run
# download. Mutually exclusive with `stt` — `stt/mod.rs`
# enforces via `compile_error!` when both are enabled
# simultaneously.
stt-candle = [
    "dep:opus-wave",
    "dep:ogg",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]
# Phase 91.x.wasm — HuggingFace Hub auto-fetch on top of the
# Candle inference path. Pulls `hf-hub 0.4` which transitively
# requires `tokio` with the `net` feature → `mio` → doesn't
# compile on `wasm32-unknown-unknown` (no kernel networking).
# Splitting `hf-hub` behind this sub-feature lets WASM consumers
# build `stt-candle` minus the auto-fetch path; they ship the
# SafeTensors bundled in the WASM artifact + pin
# `TranscribeConfig::model_path` explicitly. On native targets
# (Linux / macOS / Windows / Android NDK) enable
# `stt-candle-hub` to keep the first-run download UX.
stt-candle-hub = [
    "stt-candle",
    "dep:hf-hub",
]
# Phase 91.x.wasm.phase-4 — cloud STT backends. SplitS into
# two base features so wasm32 consumers don't pay the
# `rustls-tls` native-only cost:
#
#   `stt-cloud-wasm` — minimal, browser-compatible. Pulls
#     reqwest with just the workspace-pin baseline features
#     (`json`, `stream`, `cookies`, `charset`, `http2`). The
#     browser fetch API handles TLS without a Rust TLS dep.
#     Use this for `wasm32-unknown-unknown` microapps.
#
#   `stt-cloud` — native-default. Stacks `rustls-tls` on top
#     of the wasm base so HTTPS works on Linux / macOS /
#     Windows / Android (no system OpenSSL). The compound
#     features (`stt-cloud-anthropic`, `stt-cloud-local-candle`)
#     are native-only anyway and auto-include `stt-cloud`.
#
# Phase 91.x.wasm.phase-4c.3 (real) — the workspace-pin trim
# (removed `rustls-tls` + `macos-system-configuration` from
# `workspace.dependencies.reqwest`) unblocks the wasm32 path
# because resolver-2 no longer unifies those features into
# wasm32 SDK builds. Both REST legs (OpenAI / Groq) compile
# cleanly on wasm32 with `stt-cloud-wasm`. Anthropic
# `voice_stream` WebSocket leg stays native-only (its own
# `cfg(not(wasm32))` — tokio-tungstenite needs TCP types).
# Phase 91.x.wasm.phase-4c.3 — both features are now no-ops
# at the Cargo level (reqwest is per-target unconditional);
# they only gate the `stt::cloud` module visibility via
# `cfg(feature = "stt-cloud-wasm")`. Consumers enable
# `stt-cloud` on native, `stt-cloud-wasm` on wasm32 —
# functionally equivalent today, but the split preserves a
# future hook for per-target opt-in features.
stt-cloud-wasm = []
stt-cloud = ["stt-cloud-wasm"]
# Phase 91.x.wasm.phase-4b — Anthropic voice_stream WebSocket
# STT (per the claude-code-leak mining). Adds tokio-tungstenite
# for the WebSocket transport on top of `stt-cloud` (native
# only). Implies `stt-cloud` (the native variant) because
# tokio-tungstenite pulls tokio's `net` feature which doesn't
# compile for wasm32 — WASM voice_stream would need a
# `web-sys::WebSocket`-based swap-in (filed as Phase
# 91.x.wasm.phase-4c.4).
stt-cloud-anthropic = [
    "stt-cloud",
    "dep:tokio-tungstenite",
    "dep:futures",
]
# Phase 91.x.wasm.phase-4d — bridge feature that wraps the local
# Candle backend under the cloud `SttProvider` trait so it can
# sit at the tail of a `CompositeProvider` fallback chain.
# Implies both `stt-cloud` (trait + composite) and `stt-candle`
# (local inference) and pulls `tempfile` for the in-memory-bytes
# → on-disk-path bridge the audio decode chain requires. Use:
#
#   CompositeProvider::new(vec![
#       Box::new(AnthropicVoiceStream::new(token)),  // cloud
#       Box::new(LocalCandleProvider::new(cfg)),     // fallback
#   ])
#
# Native-only by transitive dependency (Candle inference doesn't
# compile for wasm32) — selects the rustls-tls-on `stt-cloud`
# variant accordingly.
stt-cloud-local-candle = [
    "stt-cloud",
    "stt-candle",
    "dep:tempfile",
]
# Phase 91.10 — GPU / SIMD acceleration backends for the Candle
# STT path. Default `stt-candle` is CPU-only pure-Rust so it
# cross-compiles to every target the workspace ships. Opt into
# one of these per build target when the deployment has the
# matching hardware + toolchain available; they stack on top
# of `stt-candle` (the audio decode + tokenizer pipeline stays
# the same — only the Tensor backend swaps).
#
# Mutually exclusive: pick the one matching your runtime
# hardware. Mixing them is a Candle-level error, not ours.
stt-candle-metal = [
    "stt-candle",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
stt-candle-cuda = [
    "stt-candle",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
stt-candle-accelerate = [
    "stt-candle",
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
# First-run wizard scaffolding: a generic `CachedSnapshot<T>` with
# TTL invalidation and an `LlmProber` that validates an OpenAI-
# compatible API key server-side (`GET {base_url}/models`) so the
# raw key never leaves the microapp. Pulls `reqwest` rustls-only
# to avoid system OpenSSL.
wizard = []
# Voice-mode reply pipeline — `VoiceModeStore` toggle + text
# normalizer + SSML hinter + `TtsProvider` trait with a Microsoft
# Edge Read-Aloud impl + `synthesize_voice_note` end-to-end
# pipeline (text → SSML → mp3 → opus/ogg). Edge's public endpoint
# only reliably streams the mp3 profiles, so the SDK transcodes
# the mp3 to ogg-opus in pure Rust before handing the bytes to the
# WhatsApp PTT path: `symphonia` decodes the mp3, `opus-wave`
# encodes opus packets, `ogg` muxes the container. Implies
# `events` so the store can ride on the same SQLite pool the
# firehose owns.
voice = [
    "events",
    "dep:msedge_tts",
    "dep:regex",
    "dep:once_cell",
    "dep:symphonia",
    "dep:opus-wave",
    "dep:ogg",
]
# Phase 81.15.a — child-side `PluginAdapter` for out-of-tree
# subprocess plugins. Gated so existing microapp consumers don't
# pull the `nexo-plugin-manifest` + `nexo-broker` deps unless they
# author plugins. Plugin authors enable this feature in their
# Cargo.toml; microapp authors leave it off.
plugin = ["dep:nexo-plugin-manifest", "dep:nexo-broker", "dep:nexo-llm", "dep:nexo-memory", "dep:toml", "dep:dashmap"]
# Phase 82.15 / M15.3 — identity store traits + sqlite default
# impl. Person + PersonEmail + Company stores keyed by tenant
# id with composite indexes. Pulls sqlx + chrono so non-CRM
# microapps don't pay the dep cost.
identity = ["dep:sqlx", "dep:chrono"]
# Phase 82.15 / M15.4 — declarative routing rules engine.
# Predicate AST + tenant-scoped dispatcher + YAML loader.
# Pulls serde_yaml; useful beyond CRM (any microapp routing
# inbound to handlers per declarative rules).
routing = ["dep:serde_yaml"]
# Phase 82.15 / M15.5 — enrichment primitives.
# Curated domain classifier (200+ public providers + 30
# disposable hosts), TTL-keyed (tenant_id, domain) sqlite
# cache, and an EnrichmentSource trait + chain runner so
# consumers compose fallback adapters in priority order.
enrichment = ["dep:sqlx", "dep:once_cell"]
# M15.23.a.1 — Engagement tracking primitives: HMAC-signed
# `MsgId` / `LinkId` URL tokens, HTML helpers that inject the
# 1×1 open-pixel + rewrite anchor `href` through the click
# redirector, plus a pure 1×1 transparent GIF blob constant
# the ingest route serves. Async storage layer lives separately
# in `tracking-store` so consumers that only need URL signing /
# HTML rewriting don't pull SQLx.
tracking = ["dep:hmac", "dep:sha2", "dep:subtle", "dep:base64", "dep:regex", "dep:once_cell"]
tracking-store = ["tracking", "dep:sqlx", "dep:chrono"]
# M15.23.f — Lead scoring primitives: a `Scorer` trait, a
# `Score` newtype (0..=100) carrying reason traces, and a
# `HeuristicScorer` default that composes weighted rules
# (domain kind, response time, reply length, intent label,
# signature seniority hint). Pure-rust, no async, no extra
# deps — every microapp / extension that wants tenant-scoped
# scoring picks the trait up for free.
scoring = []
# M15.23.d — Topic guardrail classifier: a pure-rust regex-
# based tagger that scans inbound text against an operator-
# configured list of patterns + actions (`force_approval` /
# `block`). Used by any extension that wants to gate
# autonomous behaviour on topic-sensitive content. Pulls
# `regex` + `once_cell` (compile-once cached patterns).
guardrails = ["dep:regex", "dep:once_cell"]
# M15.23.b — Operator-supplied template library + snippets.
# Re-exports the workspace `render_template` (mustache-lite,
# `{{path.to.field}}` over a JSON context) plus typed wire
# shapes for named templates + reusable snippets. Sandboxed
# by construction — no helpers, no eval, no IO. Pulls only
# the existing serde + nexo-tool-meta deps already in tree.
templating = []
# F26 — opt-in Handlebars renderer for templates that
# outgrow the mustache-lite default (conditionals, loops,
# `{{#with}}` blocks). Sandboxed-by-construction: no
# custom helpers / partials registered, no filesystem /
# network access surfaces. Strictly additive on top of the
# `templating` feature.
templating-handlebars = ["templating", "dep:handlebars"]
# F29 — email subject normalisation + synthetic thread-id
# helpers. Pure string primitives mined during M17.3 in the
# marketing extension; reusable by any microapp that
# ingests inbound email (helpdesk, archive, CRM). Pulls
# `sha2` for the deterministic synth-id hash.
email-threading = ["dep:sha2"]
# F29 — generic time-bucketed dedup cache. In-memory by
# default; opt-in `dedup-sled` feature persists across
# process restarts. Lifted from the marketing extension's
# F25 work — useful for any notification publisher that
# needs to suppress at-least-once redelivery duplicates.
dedup = []
dedup-sled = ["dedup", "dep:sled"]
# Email-template authoring + render — block schema (heading,
# paragraph, button, image, divider, spacer, list, row,
# column with per-cell background colour + image), table-
# based renderer that survives Outlook + Gmail mobile, an
# email-safe HTML sanitizer for rich-text fields, a per-tenant
# SQLite store for templates, and a SHA-256 content-addressed
# blob store for inline images. Lifted from the marketing
# extension; useful for any microapp that builds outbound
# emails (notifications, recibos, onboarding, transactional
# templates). Pulls sqlx + chrono + sha2 + nexo-sanitize +
# nexo-media.
email-template = ["dep:sqlx", "dep:chrono", "dep:sha2", "dep:nexo-sanitize", "dep:nexo-media"]
# Per-tenant module on/off toggle. Operator-facing pause
# switch: store + RwLock cache + admin-friendly read/write.
# Lifted from the marketing extension's `MarketingState`;
# any microapp that wants a kill switch on its automated
# effects (cron sweeps, AI calls, notifications) consumes
# this module. Pulls sqlx + chrono.
module-state = ["dep:sqlx", "dep:chrono"]
# Per-tenant attachment blob store for outbound compose
# flows. SHA-256 content-addressed, MIME allowlist (PDF/
# Office/zip/text/images), 20 MB cap. Configurable table
# name so each microapp owns its own table. Lifted from
# the marketing extension; useful for any microapp with an
# operator compose surface (helpdesk, transactional sends).
compose-attachment = ["dep:sqlx", "dep:chrono", "dep:sha2"]
# Per-tenant compose drafts store. Save partial form state
# (recipient + subject + body + builder blocks + attachment
# refs + template binding) so the operator can rehydrate
# WIP outbounds. Configurable table name + empty-title
# fallback for locale flexibility. Lifted from the marketing
# extension; useful for any microapp with operator compose.
compose-draft = ["dep:sqlx", "dep:chrono"]
# `run_idempotent_alter[s]` — small helper that swallows the
# "duplicate column name" / "already exists" SQLite error
# pattern shared by every idempotent ALTER TABLE in tree.
# Replaces the substring-match boilerplate hand-rolled across
# module_state, compose_attachment, compose_draft, and
# email_template stores. Pulls only sqlx — already optional
# behind the consumer features above.
db-migrate = ["dep:sqlx"]

[dependencies]
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
# Phase 91.x.wasm.phase-2 — direct version pin (not `workspace =
# true`) so this crate's tokio feature set isn't unionised with
# the workspace-level `tokio = { features = [\"full\"] }` pin
# when this crate is built standalone (e.g. `cargo check -p
# nexo-microapp-sdk --target wasm32-unknown-unknown`). `full`
# includes `net` which drags `mio`, which doesn't compile on
# wasm32.
#
# WASM-safe baseline: `macros`, `rt`, `sync`, `io-util`, `time`
# (tokio's own compile_error allows only these on wasm32). The
# extra `io-std` + `rt-multi-thread` features the native SDK
# uses (stdin/stdout for plugin JSON-RPC; multi-threaded runtime
# for parallel tasks) are added only on non-wasm targets via
# the cfg-target-specific block below. Cargo unifies the two
# dep entries for native builds; WASM only sees the baseline.
tokio       = { version = "1", default-features = false, features = ["macros", "rt", "sync", "io-util", "time"] }
async-trait = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
nexo-tool-meta = { workspace = true }
uuid        = { workspace = true }

# Phase 91.x.wasm — uuid needs an RNG backend on
# `wasm32-unknown-unknown` (no kernel `/dev/urandom`). The `js`
# feature wires uuid to `wasm-bindgen` + `js-sys` so the browser
# `crypto.getRandomValues` API drives v4/v5 generation. Cfg-gated
# so native targets don't pull `wasm-bindgen` unnecessarily.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
# Phase 91.x.wasm.phase-4c.3 — wasm-clean reqwest pin: only
# `json` so reqwest's browser fetch backend resolves without
# pulling rustls-tls / tokio-fs / cookies / http2 (all
# native-only). The browser handles TLS / cookies / HTTP2 in
# its fetch implementation; we just need reqwest's
# `wasm-bindgen`-backed Client.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Phase 91.x.wasm.phase-2 — extra tokio features the native SDK
# needs on top of the WASM-safe baseline above. `io-std` powers
# stdin/stdout for the plugin JSON-RPC dispatch; `rt-multi-thread`
# is the runtime daemon binaries use to parallelise work; `fs`
# is the async-fs reader the audio decode chain uses (the
# legacy whisper-rs path also needs it via `tokio::fs::read`).
# All three are unsupported on wasm32 — tokio's own
# compile_error rejects them — so they live behind a non-wasm32
# cfg.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["io-std", "rt-multi-thread", "fs", "process"] }
# Phase 91.x.wasm.phase-4c.3 — native reqwest with rustls-tls.
# Separate decl from the wasm32 block so features differ per
# target without hitting Cargo's "duplicate key" on a single
# optional dep inside `[dependencies]`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Phase 82.10 — admin RPC pending-request map. Optional dep
# (only the `admin` feature pulls it). Keeps the default
# microapp dep tree slim.
dashmap     = { workspace = true, optional = true }
# Phase 81.15.a — gated by the `plugin` feature. Pulled only by
# plugin authors who use `PluginAdapter`; microapp authors leave
# the feature off and don't pay the dep cost.
nexo-plugin-manifest = { version = "0.1.4", path = "../plugin-manifest", optional = true }
nexo-broker = { version = "0.1.4", path = "../broker", optional = true }
# Phase 81.15.c — child-side typed wrappers for memory.recall +
# llm.complete RPCs. nexo-llm gives ChatMessage/ChatRequest/
# ChatResponse types so authors construct + decode messages
# with the same shape the daemon uses; nexo-memory gives
# MemoryEntry for recall_memory results.
nexo-llm = { version = "0.1.5", path = "../llm", optional = true }
nexo-memory = { version = "0.1.5", path = "../memory", optional = true }
toml = { version = "0.8", optional = true }
# `events` feature — SQLite append-log + retention sweep +
# wall-clock cutoff for time-based pruning. All optional;
# microapps that don't enable `events` skip the deps entirely.
sqlx       = { workspace = true, optional = true }
chrono     = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
# `stt` feature — whisper.cpp wrapper. Default-features off to
# skip the OpenBLAS auto-link (each microapp surfaces its own BLAS
# preference via system libs if needed).
whisper-rs = { version = "0.13", default-features = false, optional = true }
# `stt-candle` feature — pure-Rust Whisper via HuggingFace Candle.
# Defaults left ON for `candle-core` so the CPU backend stays
# wired (turning defaults off would strip the CPU path; that's
# how Candle ships); GPU backends (Metal / CUDA / accelerate)
# stack on top via Phase 91.10 opt-in features.
candle-core         = { version = "0.8", optional = true }
candle-nn           = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
# `tokenizers` reads the `tokenizer.json` HuggingFace ships
# alongside the Whisper SafeTensors. `default-features = false`
# strips the upstream http client (we fetch via `hf-hub`
# ourselves), the indicatif progress bar, and the `onig` regex
# backend. `onig` would drag the C `oniguruma` library —
# incompatible with our pure-Rust Android NDK + WASM cross-compile
# goal. The `unstable_wasm` feature selector swaps `onig` for
# the pure-Rust `fancy-regex` crate; the name is historical
# (the path was added for WASM first) but the selector works on
# every target. tokenizers 0.22 is the version Candle workspace
# pins as of 2026-05.
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"], optional = true }
# `hf-hub` downloads the SafeTensors + tokenizer.json on first
# run when `TranscribeConfig::model_id` is set + `model_path`
# is empty. `rustls-tls` mirrors the workspace TLS posture set
# by Phase 27.2-follow-up.b (no openssl-sys on Android NDK).
# `hf-hub 0.4+` is the first release that exposes the
# `rustls-tls` feature; 0.3 only ships `default-tls` which is
# native-tls / openssl.
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"], optional = true }
# Pure-Rust audio codec stack shared by `stt` (decoding inbound
# WhatsApp/Telegram ogg-opus voice notes) and `voice` (encoding
# the mp3 Edge returns into the ogg-opus PTT format WhatsApp
# expects). Replaces the `ffmpeg` subprocess in both pipelines:
#
# - `opus-wave` is a SILK+CELT codec (RFC 6716 conformant and
#   cross-validated against C libopus); ships both decoder and
#   encoder.
# - `ogg` muxes/demuxes the container.
# - `symphonia` decodes mp3 (Edge TTS output) and other formats
#   when broader STT input support is enabled.
opus-wave = { version = "3.0", optional = true }
ogg = { version = "0.9", optional = true }
symphonia = { version = "0.5", default-features = false, features = [
    "mp3"
], optional = true }
# NOTE: reqwest moved into per-target dependency blocks
# (see [target.'cfg(...)'] sections below) so we can give it
# different feature sets on wasm32 vs native — Cargo doesn't
# allow per-target features on a single optional dep inside
# `[dependencies]`. Phase 91.x.wasm.phase-4c.3.
# Phase 91.x.wasm.phase-4b — Anthropic voice_stream WebSocket
# transport. `rustls-tls-webpki-roots` skips the system trust
# store probe (we ship the public Mozilla roots inside the
# wasm-bindgen-free SDK build path; native uses Mozilla CAs
# too for consistency with the workspace TLS posture).
tokio-tungstenite = { workspace = true, optional = true }
# `futures::{StreamExt, SinkExt}` powers the ws split
# read/write split + select_all on the finalize timers. The
# workspace already pins `futures = "0.3"`.
futures = { workspace = true, optional = true }
# Phase 91.x.wasm.phase-4d — RAII tempfile for the
# `LocalCandleProvider` bridge: cloud-side `SttProvider` calls
# arrive with the audio buffer in memory, but Candle's decode
# chain reads from disk, so we materialise to a tempfile before
# handing off. Cleanup on drop guarantees voice notes don't leak
# even on inference panic. Direct version pin (the workspace
# only carries `tempfile` as a regular dep on the root daemon
# binary, not as a `workspace.dependencies` entry).
tempfile = { version = "3", optional = true }
# `voice` feature — Microsoft Edge Read-Aloud websocket wrapper.
msedge_tts = { package = "msedge-tts", version = "0.3", optional = true }
regex      = { version = "1", optional = true }
once_cell  = { version = "1", optional = true }
# `routing` feature — YAML loader for the rules engine.
# Same workspace serde_yaml version as the rest of the framework.
serde_yaml = { workspace = true, optional = true }
# `tracking` feature — HMAC token signer + HTML helpers.
# RustCrypto MAC stack; constant-time tag comparison via subtle.
hmac   = { version = "0.12", optional = true }
sha2   = { version = "0.10", optional = true }
subtle = { version = "2",    optional = true }
base64 = { version = "0.22", optional = true }
# F29 — sled keyspace for cross-restart notification dedup.
# Optional; default builds skip it.
sled   = { version = "0.34", optional = true }
# F26 — Handlebars renderer for the `templating-handlebars`
# feature. Default features keep the dep tree narrow (no
# heavy deps).
handlebars = { version = "5", default-features = false, optional = true }
# `email-template` feature — block render uses the css/url
# sanitisers, asset_store re-encodes uploads via the image
# pipeline. Both crates already exist in the framework as
# focused mini-crates; opting in is cheap.
nexo-sanitize = { workspace = true, optional = true }
nexo-media    = { workspace = true, optional = true }

[dev-dependencies]
nexo-microapp-sdk = { path = ".", features = ["test-harness", "outbound", "events", "stt", "wizard", "voice", "identity", "routing", "enrichment", "tracking", "tracking-store", "scoring", "guardrails", "templating", "templating-handlebars", "email-threading", "email-template", "module-state", "compose-attachment", "compose-draft", "db-migrate", "dedup", "dedup-sled"] }
tempfile          = "3"
tokio             = { workspace = true, features = ["full"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
