[package]
name = "nexo-setup"
description   = "Setup wizard, capability inventory, and doctor command for Nexo."
version       = "0.1.1"
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = { workspace = true }
categories    = { workspace = true }
[features]
default = []
# Phase 79.10 — propagate the gate from nexo-core. When this
# feature is on, `crates/setup/src/config_tool_bridge.rs`
# compiles and exposes the concrete `YamlPatchApplier` +
# `DenylistChecker` impls main.rs wires per-agent.
config-self-edit = ["nexo-core/config-self-edit"]

[dependencies]
nexo-config = { version = "0.1.7", path = "../config" }
nexo-plugin-email = { workspace = true }
nexo-core = { version = "0.1.1", path = "../core" }
nexo-extensions = { version = "0.1.1", path = "../extensions" }
nexo-plugin-manifest = { version = "0.1.0", path = "../plugin-manifest" }
nexo-tool-meta = { workspace = true }
nexo-auth = { version = "0.1.1", path = "../auth" }
nexo-llm = { version = "0.1.1", path = "../llm" }
nexo-llm-auth = { version = "0.1.0", path = "../llm-auth" }
anyhow       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_yaml   = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
globset      = { workspace = true }
dialoguer    = { version = "0.11" }
console      = "0.15"
tempfile     = "3"
reqwest      = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
# Phase 82.10.n — EmailPersister IMAP probe needs a minimal
# TCP + TLS dial (we don't hit the full IMAP LOGIN path here).
tokio-rustls       = { workspace = true }
rustls             = { workspace = true }
rustls-native-certs = { workspace = true }
base64       = { workspace = true }
sha2         = { workspace = true }
uuid         = { workspace = true, features = ["v4"] }
chrono       = { workspace = true }
dashmap      = { workspace = true }
async-trait  = { workspace = true }
rand         = "0.8"
secrecy      = "0.8"
indicatif    = "0.17"
# Cross-platform browser opener — replaces the per-OS
# `xdg-open` / `open` / `start` `Command::new` spawn in the
# Anthropic OAuth flow.
webbrowser = "1"
# Phase 81.19.a — pulled through `[workspace.dependencies]` so the
# version + path stay synchronised with the proyecto Cargo.toml
# entry that points at the standalone repo.
nexo-plugin-whatsapp = { workspace = true }
nexo-plugin-google = { version = "0.1.1", path = "../plugins/google" }
nexo-pairing = { version = "0.1.2", path = "../pairing" }
# Phase 83.8.4.b — broker handle for the outbound dispatcher
# adapter (publishes to per-channel `plugin.outbound.*` topics).
nexo-broker = { version = "0.1.1", path = "../broker" }

[dev-dependencies]
# C3 — drift-prevention test for `INVENTORY` walks the workspace
# crates dir scanning for `env::var("X")` literals.
walkdir = "2"
regex = "1"
# Phase 82.10.p — pairing trigger integration test asserts the
# cancel token observed by the trigger task gets cancelled by
# pairing/cancel.
tokio-util = { workspace = true }
async-trait = { workspace = true }
nexo-tool-meta = { version = "0.1.3", path = "../tool-meta" }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
