[package]
name = "nexo-setup"
description   = "Setup wizard, capability inventory, and doctor command for Nexo."
version       = "0.1.2"
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = { workspace = true }
categories    = { workspace = true }
[features]
default = []
# Phase 79.10 — propagate the gate from nexo-core. When this
# feature is on, `crates/setup/src/config_tool_bridge.rs`
# compiles and exposes the concrete `YamlPatchApplier` +
# `DenylistChecker` impls main.rs wires per-agent.
config-self-edit = ["nexo-core/config-self-edit"]
# Phase 93.12.c — propagate the daemon-level whatsapp gate
# into setup. With this feature on, `admin_bootstrap` /
# `admin_adapters` / `writer` compile the whatsapp-specific
# Phase 81.20.x Stage 7 Phase 2 close-out — `plugin-whatsapp`
# feature deleted from setup. All cfg gates that selected
# between whatsapp dashboard source / translator / bot-handle
# setups vs absence are removed; the translator + dashboard
# source compile unconditionally now.

[dependencies]
nexo-config = { version = "0.1.10", path = "../config" }
# Phase 81.20.x F2 — wizard validators use the framework-agnostic
# probe crate so this crate stops linking the full plugin lib.
nexo-email-probe = "0.1.0"
nexo-core = { version = "0.2.1", path = "../core" }
nexo-extensions = { version = "0.1.4", path = "../extensions" }
nexo-plugin-manifest = { version = "0.1.7", path = "../plugin-manifest" }
nexo-tool-meta = { workspace = true }
nexo-auth = { version = "0.1.9", path = "../auth" }
nexo-llm = { version = "0.1.5", path = "../llm" }
nexo-llm-auth = { version = "0.1.1", path = "../llm-auth" }
nexo-memory = { workspace = true }
nexo-memory-snapshot = { workspace = true }
anyhow       = { workspace = true }
semver       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_yaml   = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
globset      = { workspace = true }
dialoguer    = { version = "0.11" }
console      = "0.15"
tempfile     = "3"
reqwest = { workspace = true, features = ["rustls-tls", "stream", "cookies", "http2"] }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
# Phase 82.10.n — EmailPersister IMAP probe needs a minimal
# TCP + TLS dial (we don't hit the full IMAP LOGIN path here).
tokio-rustls       = { workspace = true }
rustls             = { workspace = true }
rustls-native-certs = { workspace = true }
base64       = { workspace = true }
sha2         = { workspace = true }
uuid         = { workspace = true, features = ["v4"] }
chrono       = { workspace = true }
dashmap      = { workspace = true }
async-trait  = { workspace = true }
rand         = "0.8"
secrecy      = "0.8"
indicatif    = "0.17"
# Cross-platform browser opener — replaces the per-OS
# `xdg-open` / `open` / `start` `Command::new` spawn in the
# Anthropic OAuth flow.
webbrowser = "1"
# Phase 81.19.a — pulled through `[workspace.dependencies]` so the
# version + path stay synchronised with the proyecto Cargo.toml
# entry that points at the standalone repo.
# Phase 81.20.x Bucket C2 BC.6 — `nexo-plugin-whatsapp` direct
# dep removed. Pairing spawns the standalone binary instead.
# Phase 94 — `nexo-plugin-google` direct dep removed. OAuth flows
# now spawn the standalone `nexo-plugin-google --oauth-once`
# binary (operator installs via `cargo install nexo-plugin-google`).
nexo-pairing = { version = "0.1.8", path = "../pairing" }
# Phase 83.8.4.b — broker handle for the outbound dispatcher
# adapter (publishes to per-channel `plugin.outbound.*` topics).
nexo-broker = { version = "0.1.5", path = "../broker" }
# Phase 81.21.b.b follow-up — `LivePluginRestarter` adapter
# needs `tokio_util::sync::CancellationToken` for the
# context-shutdown propagation into `force_restart`.
tokio-util = { workspace = true }

[dev-dependencies]
# C3 — drift-prevention test for `INVENTORY` walks the workspace
# crates dir scanning for `env::var("X")` literals.
walkdir = "2"
regex = "1"
# Phase 82.10.p — pairing trigger integration test asserts the
# cancel token observed by the trigger task gets cancelled by
# pairing/cancel.
tokio-util = { workspace = true }
toml         = "0.8"
async-trait = { workspace = true }
nexo-tool-meta = { version = "0.1.16", path = "../tool-meta" }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
