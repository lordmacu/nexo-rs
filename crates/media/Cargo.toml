[package]
name = "nexo-media"
description = "Media-asset pipelines for nexo microapps — image optimisation (cap dimensions, strip metadata, re-encode at email-sane quality), MIME utilities."
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = ["nexo", "media", "image", "optimize", "thumbnail"]
categories    = ["multimedia::images"]

[lints]
workspace = true

[dependencies]
# Default features off so we don't compile codecs the operator
# whitelist excludes (BMP, TGA, etc.). PNG / JPEG / GIF / WebP
# match what the upload allowlist accepts.
image     = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
thiserror = { workspace = true }
