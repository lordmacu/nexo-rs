[package]
name = "nexo-plugin-manifest"
description = "TOML manifest schema + 4-tier validator for native Rust nexo plugins (Phase 81.1)."
version = "0.1.8"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml       = "0.8"
semver     = { workspace = true, features = ["serde"] }
regex      = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
# Phase 81.13 — compat layer logs deprecation warnings via the
# workspace tracing setup so operators see them in the same
# stream as their other plugin diagnostics.
tracing    = { workspace = true }

[dev-dependencies]
tempfile  = "3"
