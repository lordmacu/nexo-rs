nexo-webhook-server    = { version = "0.1.7", path = "crates/webhook-server" }
dirs                   = "5"
tokio-tungstenite   = { workspace = true }
tokio-util          = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
base64              = { workspace = true }
