    # at `../nexo-rs-plugin-telegram/`; no longer a workspace member.
    # Phase 81.19.a — whatsapp plugin extracted to standalone repo
    # at `../nexo-rs-plugin-whatsapp/`; no longer a workspace member.
    # Phase 81.19.b — email plugin extracted to standalone repo
    # at `../nexo-rs-plugin-email/`; no longer a workspace member.
    # Phase 94 — google plugin fully extracted. Standalone bin at
    # `../nexo-rs-plugin-google/`; lib consumed by `nexo-poller`'s
    # `google_calendar` + `gmail` builtins via the published
    # `nexo-plugin-google = "0.2.0"` crates.io release. In-tree
    # `crates/plugins/google/` deleted.
    "crates/setup",
    "crates/tunnel",
    "crates/tunnel-quick",
    "crates/auth",
    "crates/poller",
    "crates/poller-tools",
    "crates/poller-ext",
    "crates/web-search",
    "crates/pairing",
    "crates/driver-types",
    "crates/driver-claude",
    "crates/driver-permission",
    "crates/driver-loop",
    "crates/project-tracker",
    "crates/agent-registry",
    "crates/dispatch-tools",
    "crates/companion-tui",
    "crates/lsp",
    "crates/team-store",
    "crates/fork",
    "crates/dream",
    "crates/assistant",
    "crates/plugin-manifest",
    "crates/persona-manifest",
    "crates/ext-registry",
    "crates/ext-installer",
    "crates/persona-installer",
    "crates/microapp-sdk",
    "crates/microapp-http",
    "crates/compliance-primitives",
    "crates/sanitize",
    "crates/media",
    "crates/tool-meta",
    "crates/webhook-receiver",
    "crates/webhook-server",
    "crates/memory-snapshot",
    # Phase 76.15 — MCP server skeleton extension. Member because
    # we want CI / `cargo build --workspace` to keep it green; it
    # depends on `nexo-mcp` via in-tree path dep. Operators copy
    # the directory out of the repo and switch to the crates.io
    # version per the template's README.
    "extensions/template-mcp-server",
    # Phase 80.9 fixture — minimal MCP server with channel
    # capabilities for end-to-end testing of the channels
    # surface. Operator-facing fixture, not a template.
    "extensions/sample-channel-server",
    # Phase 27.2 — synthetic subprocess plugin used by the
    # daemon-side spawn-shape e2e test. Lives in its own crate so
    # cargo-dist's manifest planner can opt it out of release
    # tarballs via `[package.metadata.dist] dist = false`.
    "crates/test-fixtures/mock-subprocess-plugin",
    # Phase 96 — poller plugin fixture for Block D+E e2e tests.
    "crates/test-fixtures/poller-echo",
    "crates/test-fixtures/reference-plugin",
]
# Keep standalone extension templates out of the agent workspace so
# they don't inherit our deps or lockfile — `cp -r` (or `nexo plugin
# new`) yields a project that builds straight away, no path-dep
# surgery, no `[lints] workspace = true` to strip. Their `nexo-*`
# deps point at the published crates.io versions.
#
# `template-plugin-rust` additionally MUST be excluded because
# `nexo-rs`'s `src/plugin_new.rs` embeds its directory via
# `include_dir!`, and cargo drops workspace-member directories from
# the parent crate's `.crate` tarball — a `cargo install nexo-rs`
# would proc-macro-panic on the missing dir. As a non-member it's
# pulled into the tarball by `[package].include` below (and it ships
# its manifest as `_Cargo.toml` so cargo doesn't see a nested package
# either; the scaffolder renames it back to `Cargo.toml`).
exclude = [
    "extensions/template-rust",
    "extensions/template-plugin-rust",
    "extensions/template-microapp-rust",
]
resolver = "2"

[workspace.package]
version      = "0.1.7"
edition      = "2021"
rust-version = "1.80"
license      = "MIT OR Apache-2.0"
authors      = ["Cristian Garcia <informacion@cristiangarcia.co>"]
repository   = "https://github.com/lordmacu/nexo-rs"
homepage     = "https://lordmacu.github.io/nexo-rs/"
documentation = "https://lordmacu.github.io/nexo-rs/"
readme       = "README.md"
keywords     = ["agent", "llm", "ai", "nats", "framework"]
categories   = ["asynchronous", "api-bindings"]

[package]
name        = "nexo-rs"
description = "Nexo — multi-agent Rust framework: NATS event bus, pluggable LLM providers, channels (WhatsApp, Telegram, Email, Browser), memory, MCP, skills, and TaskFlow."
# GA cut. The rc1→rc4 pre-release cycle (Phase 27.2 multi-platform
# matrix validation) is green — release.yml built + published all 9
# targets (5 binary tarballs/zip, 2 .deb, 2 .rpm, cosign sigs) and
# the install-test matrix (debian/ubuntu .deb, fedora/rocky .rpm)
# passed end-to-end on nexo-rs-v0.1.6-rc4. 0.1.6 = the Phase 92-95
# ergonomics (broker stdio-bridge, `nexo set-broker`, zero-config
# boot, `--override-from` deep-merge, `nexo init` 19-template
# scaffolder) + packaging postinst hooks. Next pre-release wave
# bumps to `"0.1.7-rc1"` per the same flow.
version      = "0.1.6"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
documentation = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }

# Explicit publish allowlist. Needed because `src/plugin_new.rs`
# embeds the four plugin-scaffold templates via
# `include_dir!("$CARGO_MANIFEST_DIR/extensions/template-plugin-*")`
# — those dirs are separate `[workspace.members]`, which cargo
# omits from a parent package's `.crate` tarball by default, so
# the proc-macro panics at build time on a `cargo install`d copy.
# Listing them here copies them into the tarball. Once `include`
# is set it's an allowlist, so the usual files (src, build.rs,
# examples, README, licenses; Cargo.toml/Cargo.lock are implicit)
# have to be enumerated too.
include = [
    "src/**/*",
    "build.rs",
    "examples/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "NOTICE",
    "extensions/template-plugin-rust/**/*",
    "extensions/template-plugin-python/**/*",
    "extensions/template-plugin-typescript/**/*",
    "extensions/template-plugin-php/**/*",
]

[lints]
workspace = true

[features]
# Phase 81.20.x Stage 7 Phase 2 close-out — `plugin-telegram` and
# `plugin-whatsapp` features removed. Daemon no longer links any
# channel-plugin crate at compile time; canonical plugins
# discover + spawn via manifest like any other subprocess plugin.
# Operators wanting an embedded build link the plugin crate
# directly from a custom binary.
default = []
# Phase 81.20.x Stage 7 Phase 2 close-out — `plugin-whatsapp`
# feature deleted. Daemon no longer links `nexo-plugin-whatsapp`
# under any feature flag; the canonical plugin discovers + spawns
# via manifest like any other subprocess plugin. Operators
# wanting the legacy in-process `WhatsappPlugin` build a custom
# binary depending on the plugin crate directly.
# Phase 79.10 — gated self-config tool. Off until security review.
# Forwards to both nexo-core (the tool body) and nexo-setup
# (the YamlPatchApplier + DenylistChecker bridge structs main.rs
# instantiates per agent).
config-self-edit = ["nexo-core/config-self-edit", "nexo-setup/config-self-edit"]
# Phase 79.12 — stateful REPL tool (Python/Node/bash subprocesses
# that persist across LLM turns). Off by default — code execution
# is dangerous and must be explicitly opted into per-agent.
repl-tool = ["nexo-core/repl-tool"]
# Phase 36.2 — opt-in age encryption for `nexo memory snapshot`.
# Forwards to `nexo-memory-snapshot` so the encryption codec compiles
# into the binary; without the flag, the bundle path stays plaintext
# and any `--encrypt` / `.tar.zst.age` request fails fast.
snapshot-encryption = ["nexo-memory-snapshot/snapshot-encryption"]

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Phase 27.1 — opt the root crate into cargo-dist. Dev/smoke
# programs (`integration-browser-check`, `llm_smoke`) live as
# `[[example]]` entries below so cargo-dist never tries to ship
# them. The historic `mock_subprocess_plugin` `[[bin]]` was lifted
# in Phase 27.2 into `crates/test-fixtures/mock-subprocess-plugin`
# (its own crate, `dist = false`) so the manifest planner stops
# walking it.
[package.metadata.dist]
dist = true

[[bin]]
name = "nexo"
path = "src/main.rs"

# Phase 27.1 — dev/smoke programs live as examples so cargo-dist
# doesn't pick them up. Run with
# `cargo run --example integration-browser-check` or
# `cargo run --example llm_smoke`. (`browser-test` example
# removed in the 81.17.c.in-tree-removal follow-up — equivalent
# coverage lives in `nexo-rs-plugin-browser/tests/e2e_handshake.rs`.)
[[example]]
name = "integration-browser-check"
path = "examples/integration-browser-check.rs"

[[example]]
name = "llm_smoke"
path = "examples/llm_smoke.rs"

# End-to-end smoke for `nexo-tunnel` against the real Cloudflare
# argotunnel edge. Stands up a local echo server, brings up a
# quick tunnel, polls the public URL, asserts the body roundtrips.
[[example]]
name = "quick_tunnel_smoke"
path = "examples/quick_tunnel_smoke.rs"

[workspace.dependencies]
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-nats         = "0.35"
# Phase 91.x.wasm.phase-4c.3 — base pin trimmed to ONLY the
# wasm-clean features so resolver-2 doesn't unify wasm-broken
# features into wasm32 SDK builds. Removed:
#   - `rustls-tls` (rustls doesn't compile for wasm32)
#   - `macos-system-configuration` (macOS-only proxy detect)
#   - `stream` (pulls `tokio/fs`, native-only)
#   - `cookies` (gated `not(wasm32)` in reqwest's manifest)
#   - `http2` (h2 + hyper/http2, native-only)
# Native consumers re-add what they need via additive
# `features = [...]` on their own `workspace = true` decl.
# Each of the 8 native-only workspace crates adds at least
# `rustls-tls`; the daemon binary adds `rustls-tls + macos-
# system-configuration + stream + cookies + http2` (the full
# original native set).
#
# Wasm32 SDK builds get reqwest with just `json` + `charset`
# (both cross-platform); the browser fetch API handles
# everything else.
reqwest            = { version = "0.12", default-features = false, features = ["json", "charset"] }
sqlx               = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio-tungstenite  = { version = "0.21", features = ["rustls-tls-native-roots"] }
uuid               = { version = "1", features = ["v4", "v5", "serde", "macro-diagnostics"] }
chrono             = { version = "0.4", features = ["serde"] }
config             = "0.14"
serde_yaml         = "0.9"
async-trait        = "0.1"
dashmap            = "6"
humantime          = "2"
humantime-serde    = "1.1"
regex              = "1"
which              = "6"
tokio-util         = { version = "0.7", features = ["rt"] }
bytes              = "1"
ipnetwork          = { version = "0.20", features = ["serde"] }
futures            = "0.3"
base64             = "0.22"
sha2               = "0.10"
hex                = "0.4"
sqlite-vec         = "0.1"
lru                = "0.17"
libsqlite3-sys     = "0.30"
git2               = { version = "0.19", default-features = false }
notify             = "6"
notify-debouncer-full = "0.3"
arc-swap           = "1"
eventsource-stream = "0.2"
semver             = "1"
tiktoken-rs        = "0.6"
blake3             = "1"
async-imap         = "0.10"
lettre             = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-parser        = "0.9"
mail-builder       = "0.4"
html2text          = "0.13"
chardetng          = "0.1"
mime_guess         = "2"
encoding_rs        = "0.8"
hickory-resolver   = "0.24"
lsp-types          = "0.97"
globset            = "0.4"
# Phase 27.2-follow-up.b — tokio-rustls 0.26 ships `aws_lc_rs`
# in its default feature set, which forwards to `rustls/aws_lc_rs`
# and pulls the aws-lc-sys C build chain. On `aarch64-linux-android`
# (Termux + the Flutter Android FFI target) the bundled
# jitterentropy C source fails with `'sys/types.h' file not found`
# because Bionic libc differs from POSIX in subtle ways the
# upstream code assumes. Pinning `default-features = false` +
# enabling `ring` keeps every downstream `nexo-setup` /
# in-workspace consumer on the pure-Rust crypto provider.
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls             = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-native-certs = "0.7"
serde_bytes        = "0.11"
rand               = "0.8"
nexo-tool-meta     = { version = "0.1.15", path = "crates/tool-meta" }
nexo-microapp-sdk  = { version = "0.1.19", path = "crates/microapp-sdk" }
# Phase 90.x.memory — long-term memory crate exposed at workspace
# scope so `nexo-setup`'s `LiveMemoryReader` adapter can consume
# `LongTermMemory` + `MemoryEntry` types via `workspace = true`.
nexo-memory        = { version = "0.1.5", path = "crates/memory" }
# Phase 90.x.memory-snapshot — snapshot crate exposed at
# workspace scope so `nexo-setup`'s `LiveMemorySnapshotReader`
# adapter can consume `MemorySnapshotter` + `SnapshotMeta`.
nexo-memory-snapshot = { version = "0.1.4", path = "crates/memory-snapshot" }
# Phase 83.14.b — sanitize/media published independently as 0.1.6
# so consumers (microapp-sdk's `email-template` feature) can
# resolve the dep on crates.io. Workspace pin keeps the local
# override transparent for in-tree dev.
nexo-sanitize      = { version = "0.1.7", path = "crates/sanitize" }
nexo-media         = { version = "0.1.7", path = "crates/media" }
# Phase 81.19.a — declared at workspace scope so member crates
# (e.g. `crates/setup`) can pull through `workspace = true`. The
# proyecto binary's `[dependencies]` block below also references
# this name.
#
# Phase 81.19.b cleanup — extracted plugins consumed via crates.io
# only (no path-dep). All three (telegram 0.1.1, whatsapp 0.1.3,
# email 0.1.2) are on crates.io with their full dep graphs
# resolvable, so release-plz's tmp-clone walk doesn't fail anymore.
# Local-dev override against an unpublished sibling change uses a
# `[patch.crates-io]` block in `.cargo/config.toml` (gitignored)
# rather than path-deps in this file — release-plz would otherwise
# try to resolve the path inside its tmp clone and fail again.
# Phase 27.2 — pin to rustls-tls TLS backend so cross-compile to
# musl + future Android NDK targets stays on a single Rust-only
# TLS stack (rest of the workspace already runs rustls via sqlx /
# reqwest / lettre / async-nats). Default `native-tls` would drag
# `openssl-sys` through `tokio-tungstenite` and break musl
# cross-build.
# Phase 81.20.x Stage 7 Phase 2 close-out — `nexo-plugin-whatsapp`
# workspace dep removed. Whatsapp is a subprocess plugin
# discovered via `[plugin.entrypoint]` manifest; daemon no longer
# compiles the plugin crate in-tree.
# Phase 81.20.x F2.1 — `nexo-plugin-email` workspace dep removed.
# Email is a subprocess plugin discovered via `[plugin.entrypoint]`
# manifest; daemon no longer compiles the plugin crate in-tree.
nexo-tunnel-quick    = { version = "0.1", path = "crates/tunnel-quick" }

[dependencies]
tokio               = { workspace = true }
anyhow              = { workspace = true }
# Phase 81.32 c5 — `tools_per_agent` + `agent_snapshot_handles`
# became `Arc<DashMap>` so hot-spawn can insert post-boot.
dashmap             = { workspace = true }
# Phase 82.10.n followup — pin the rustls CryptoProvider at
# main(). Multiple providers (ring, aws-lc-rs) arrive
# transitively via sqlx/reqwest/lettre and rustls 0.23 panics
# on auto-pick when more than one is linked. The
# `EmailPersister` probe (TLS handshake on imap.gmail.com:993)
# is the first hot path that hit this.
rustls              = { workspace = true }
async-nats          = { workspace = true }
futures             = { workspace = true }
uuid                = { workspace = true }
rand                = "0.8"
sha2                = { workspace = true }
arc-swap            = { workspace = true }
semver              = { workspace = true }
