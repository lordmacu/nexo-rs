# Phase 81.18.b.e2e-mock-binary — `serial_test::serial` keeps the
# subprocess flip e2e tests from racing on shared OS resources
# (env vars, stdin/stdout pipes) when nextest fans them out
# across threads.
serial_test         = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Iterative release builds — full opt-level, no LTO, parallel
# codegen. Costs ~5 % runtime; saves ~50 % build time. Use for
# local validation; reserve `dist`/`--release` for publish.
[profile.release-fast]
inherits      = "release"
lto           = false
codegen-units = 16
strip         = "none"

# Phase 82.10.q — patch wa-agent to a pinned git rev of
# `lordmacu/whatsapp-rs` so the typing-clear fix in
# `src/agent.rs::run_agent_with` (explicit `send_typing(false)`
# await before `apply_response`) ships in the daemon binary.
# Phase 81.19.b cleanup — when crates.io-pinned plugins
# (nexo-plugin-{telegram,whatsapp,email}) reference monorepo
# crates by their PUBLISHED versions (e.g. `nexo-config = "0.1.1"`),
# cargo by default fetches the registry copy alongside the
# workspace's path-dep copy — two versions of the same crate
# in the resolved graph, which breaks trait + type identity
# (e.g. `WaBotHandle` from registry-nexo-core != `WaBotHandle`
# from path-nexo-core). The `[patch.crates-io]` block below
# redirects every public nexo-* crate back to the local path,
# unifying the dep graph. Add an entry here whenever a new
# nexo-* crate gets published.
[patch.crates-io]
nexo-config = { path = "crates/config" }
nexo-broker = { path = "crates/broker" }
nexo-core = { path = "crates/core" }
nexo-llm = { path = "crates/llm" }
nexo-mcp = { path = "crates/mcp" }
nexo-memory = { path = "crates/memory" }
nexo-auth = { path = "crates/auth" }
nexo-pairing = { path = "crates/pairing" }
nexo-resilience = { path = "crates/resilience" }
nexo-plugin-manifest = { path = "crates/plugin-manifest" }
nexo-microapp-sdk = { path = "crates/microapp-sdk" }
nexo-driver-types = { path = "crates/driver-types" }
nexo-driver-claude = { path = "crates/driver-claude" }
nexo-driver-permission = { path = "crates/driver-permission" }
nexo-driver-loop = { path = "crates/driver-loop" }
nexo-agent-registry = { path = "crates/agent-registry" }
nexo-project-tracker = { path = "crates/project-tracker" }
nexo-dispatch-tools = { path = "crates/dispatch-tools" }
nexo-fork = { path = "crates/fork" }
nexo-dream = { path = "crates/dream" }
nexo-memory-snapshot = { path = "crates/memory-snapshot" }
nexo-extensions = { path = "crates/extensions" }
nexo-tool-meta = { path = "crates/tool-meta" }
