[workspace.lints.clippy]
# Pragmatic suppressions for pre-existing tech debt surfaced by
# clippy 1.95 toolchain bump. Each is tracked under PHASES.md
# Phase 34.x — re-enable when a hardening sprint cleans them up.
needless_borrows_for_generic_args = "allow"
print_literal = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
# Added 2026-05-07 — clippy 1.95 surfaced ~45 stylistic findings
# across driver-permission/sed_validator + path_extractor +
# bash_destructive + microapp-sdk. Same hardening sprint owns
# the cleanup; allow at workspace level so CI's clippy gate
# doesn't block unrelated commits.
unnecessary_map_or = "allow"
collapsible_if = "allow"
manual_strip = "allow"
io_other_error = "allow"
trim_split_whitespace = "allow"
if_same_then_else = "allow"
unnecessary_to_owned = "allow"
let_and_return = "allow"
bool_assert_comparison = "allow"
type_complexity = "allow"
unwrap_or_default = "allow"
field_reassign_with_default = "allow"
cmp_owned = "allow"
should_implement_trait = "allow"
incompatible_msrv = "allow"
match_like_matches_macro = "allow"
needless_as_bytes = "allow"
manual_ignore_case_cmp = "allow"
too_many_arguments = "allow"
vec_init_then_push = "allow"
needless_lifetimes = "allow"
len_without_is_empty = "allow"
blocks_in_conditions = "allow"
await_holding_lock = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
derivable_impls = "allow"
single_char_pattern = "allow"
redundant_closure = "allow"
question_mark = "allow"
unnecessary_literal_unwrap = "allow"

