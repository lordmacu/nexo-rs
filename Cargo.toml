[workspace.lints.clippy]
# Pragmatic suppressions for pre-existing tech debt surfaced by
# clippy 1.95 toolchain bump. Each is tracked under PHASES.md
# Phase 34.x — re-enable when a hardening sprint cleans them up.
needless_borrows_for_generic_args = "allow"
print_literal = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
# Added 2026-05-07 — clippy 1.95 surfaced ~45 stylistic findings
# across driver-permission/sed_validator + path_extractor +
# bash_destructive + microapp-sdk. Same hardening sprint owns
# the cleanup; allow at workspace level so CI's clippy gate
# doesn't block unrelated commits.
unnecessary_map_or = "allow"
collapsible_if = "allow"
manual_strip = "allow"
io_other_error = "allow"
trim_split_whitespace = "allow"
if_same_then_else = "allow"
unnecessary_to_owned = "allow"
let_and_return = "allow"
bool_assert_comparison = "allow"
type_complexity = "allow"
unwrap_or_default = "allow"
field_reassign_with_default = "allow"
cmp_owned = "allow"
should_implement_trait = "allow"
incompatible_msrv = "allow"
match_like_matches_macro = "allow"
needless_as_bytes = "allow"
manual_ignore_case_cmp = "allow"
too_many_arguments = "allow"
vec_init_then_push = "allow"
needless_lifetimes = "allow"
len_without_is_empty = "allow"
blocks_in_conditions = "allow"
await_holding_lock = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
derivable_impls = "allow"
single_char_pattern = "allow"
redundant_closure = "allow"
question_mark = "allow"
unnecessary_literal_unwrap = "allow"

[workspace]
members = [
    "crates/core",
    "crates/broker",
    "crates/cdp",
    "crates/llm",
    "crates/llm-auth",
    "crates/memory",
    "crates/config",
    "crates/extensions",
    "crates/mcp",
    "crates/resilience",
    "crates/taskflow",
    # Phase 81.18 — telegram plugin extracted to standalone repo
    # at `../nexo-rs-plugin-telegram/`; no longer a workspace member.
    # Phase 81.19.a — whatsapp plugin extracted to standalone repo
    # at `../nexo-rs-plugin-whatsapp/`; no longer a workspace member.
    # Phase 81.19.b — email plugin extracted to standalone repo
    # at `../nexo-rs-plugin-email/`; no longer a workspace member.
    "crates/plugins/google",
    "crates/setup",
    "crates/tunnel",
    "crates/auth",
    "crates/poller",
    "crates/poller-tools",
    "crates/poller-ext",
    "crates/web-search",
    "crates/pairing",
    "crates/driver-types",
    "crates/driver-claude",
    "crates/driver-permission",
    "crates/driver-loop",
    "crates/project-tracker",
    "crates/agent-registry",
    "crates/dispatch-tools",
    "crates/companion-tui",
    "crates/lsp",
    "crates/team-store",
    "crates/fork",
    "crates/dream",
    "crates/assistant",
    "crates/plugin-manifest",
    "crates/ext-registry",
    "crates/ext-installer",
    "crates/microapp-sdk",
    "crates/microapp-http",
    "crates/compliance-primitives",
    "crates/sanitize",
    "crates/media",
    "crates/tool-meta",
    "crates/webhook-receiver",
    "crates/webhook-server",
    "crates/memory-snapshot",
    # Phase 76.15 — MCP server skeleton extension. Member because
    # we want CI / `cargo build --workspace` to keep it green; it
    # depends on `nexo-mcp` via in-tree path dep. Operators copy
    # the directory out of the repo and switch to the crates.io
    # version per the template's README.
    "extensions/template-mcp-server",
    # Phase 83.7 — microapp template (Rust) — copy + rename to
    # bootstrap a domain-specific microapp using the
    # `nexo-microapp-sdk` builder API. README points authors at
    # `docs/src/microapps/contract.md` for porting to other langs.
    "extensions/template-microapp-rust",
    # Phase 81.15.a / 81.17.c — out-of-tree subprocess plugin
    # template. Copy + rename to bootstrap a channel plugin that
    # speaks the wire spec at `nexo-plugin-contract.md` via the
    # `nexo-microapp-sdk` `plugin` feature + `PluginAdapter`.
    # Member because CI must keep it green; operators copy the
    # directory out of the repo and swap path deps for crates.io.
    "extensions/template-plugin-rust",
    # Phase 80.9 fixture — minimal MCP server with channel
    # capabilities for end-to-end testing of the channels
    # surface. Operator-facing fixture, not a template.
    "extensions/sample-channel-server",
]
# Keep standalone extension templates out of the agent workspace so they don't
# inherit our deps or lockfile. Users copy them verbatim and build separately.
exclude = [
    "extensions/template-rust",
]
resolver = "2"

[workspace.package]
version      = "0.1.6"
edition      = "2021"
rust-version = "1.80"
license      = "MIT OR Apache-2.0"
authors      = ["Cristian Garcia <informacion@cristiangarcia.co>"]
repository   = "https://github.com/lordmacu/nexo-rs"
homepage     = "https://lordmacu.github.io/nexo-rs/"
documentation = "https://lordmacu.github.io/nexo-rs/"
readme       = "README.md"
keywords     = ["agent", "llm", "ai", "nats", "framework"]
categories   = ["asynchronous", "api-bindings"]

[package]
name        = "nexo-rs"
description = "Nexo — multi-agent Rust framework: NATS event bus, pluggable LLM providers, channels (WhatsApp, Telegram, Email, Browser), memory, MCP, skills, and TaskFlow."
version      = "0.1.6"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
documentation = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }

[lints]
workspace = true

[features]
default = []
# Phase 79.10 — gated self-config tool. Off until security review.
# Forwards to both nexo-core (the tool body) and nexo-setup
# (the YamlPatchApplier + DenylistChecker bridge structs main.rs
# instantiates per agent).
config-self-edit = ["nexo-core/config-self-edit", "nexo-setup/config-self-edit"]
# Phase 79.12 — stateful REPL tool (Python/Node/bash subprocesses
# that persist across LLM turns). Off by default — code execution
# is dangerous and must be explicitly opted into per-agent.
repl-tool = ["nexo-core/repl-tool"]
# Phase 36.2 — opt-in age encryption for `nexo memory snapshot`.
# Forwards to `nexo-memory-snapshot` so the encryption codec compiles
# into the binary; without the flag, the bundle path stays plaintext
# and any `--encrypt` / `.tar.zst.age` request fails fast.
snapshot-encryption = ["nexo-memory-snapshot/snapshot-encryption"]

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Phase 27.1 — opt the root crate into cargo-dist. The dev/smoke bins
# (`browser-test`, `integration-browser-check`, `llm_smoke`) carry
# `required-features = ["dev-bins"]` so `cargo build` (default
# features) skips them, and cargo-dist's per-crate `cargo build` runs
# without that feature so they don't end up in release tarballs.
[package.metadata.dist]
dist = true

[[bin]]
name = "nexo"
path = "src/main.rs"

# Phase 81.18.b.e2e-mock-binary — tiny JSON-RPC mock subprocess
# used by `tests/subprocess_flip_e2e.rs` to validate the
# daemon-side spawn wire shape (env passthrough, initialize
# handshake, shutdown reply) without dragging real plugin
# binaries + network deps into CI. Excluded from `cargo dist`
# by virtue of NOT being in `[workspace.metadata.dist]
# bin-aliases`.
[[bin]]
name = "mock_subprocess_plugin"
path = "tests/fixtures/mock_subprocess_plugin.rs"
test = false
doc = false
bench = false

# Phase 27.1 — dev/smoke programs live as examples so cargo-dist
# doesn't pick them up. Run with
# `cargo run --example integration-browser-check` or
# `cargo run --example llm_smoke`. (`browser-test` example
# removed in the 81.17.c.in-tree-removal follow-up — equivalent
# coverage lives in `nexo-rs-plugin-browser/tests/e2e_handshake.rs`.)
[[example]]
name = "integration-browser-check"
path = "examples/integration-browser-check.rs"

[[example]]
name = "llm_smoke"
path = "examples/llm_smoke.rs"

