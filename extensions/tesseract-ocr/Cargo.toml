[package]
name = "tesseract-ocr-ext"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tesseract-ocr"
path = "src/main.rs"

[lib]
name = "tesseract_ocr_ext"
path = "src/lib.rs"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Iterative release builds — full opt-level, no LTO, parallel
# codegen. Costs ~5 % runtime perf vs `release`; saves ~50 % build
# time. Use for local validation; reserve `--release` for publish.
[profile.release-fast]
inherits      = "release"
lto           = false
codegen-units = 16
strip         = "none"
