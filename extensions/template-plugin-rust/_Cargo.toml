[package]
name = "template-plugin-rust"
description = "Skeleton out-of-tree subprocess plugin for Nexo (Phase 81.15.a/.17.c) — copy + rename to start a new plugin."
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Cristian Garcia <informacion@cristiangarcia.co>"]
publish = false

[[bin]]
name = "template_plugin_rust"
path = "src/main.rs"

[dependencies]
# Published SDK + broker crates — this template builds standalone
# straight out of `nexo plugin new` (or a `git clone` of the
# nexo-rs repo): no path-dep surgery needed.
nexo-microapp-sdk = { version = "0.1", features = ["plugin"] }
nexo-broker       = "0.1"

anyhow       = "1"
serde_json   = "1"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std"] }
tracing      = "0.1"
tracing-subscriber = "0.3"

# (No `[lints] workspace = true` — this template isn't a workspace
#  member; it's in `[workspace.exclude]` so `cargo install nexo-rs`
#  can embed its directory. `nexo plugin new` materializes this
#  file back to `Cargo.toml` in the scaffolded output.)

[dev-dependencies]
tempfile = "3"
flate2   = "1"
tar      = "0.4"
sha2     = "0.10"
hex      = "0.4"
