[package]
name = "ext-common"
version = "0.1.0"
edition = "2021"

[workspace]

# Iterative release builds — full opt-level, no LTO, parallel
# codegen. Costs ~5 % runtime perf vs `release`; saves ~50 % build
# time. Use for local validation; reserve `--release` for publish.
[profile.release-fast]
inherits      = "release"
lto           = false
codegen-units = 16
strip         = "none"
